name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main]

jobs:
  rootfs-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required paths
        run: |
          test -f rootfs/init
          test -f rootfs/bin/about
          test -f rootfs/bin/hutinfo
          test -f configs/hutos_defconfig
          test -f build.sh
          test -x build.sh || chmod +x build.sh scripts/*.sh run.sh

      - name: Validate init shebang
        run: head -1 rootfs/init | grep -q busybox

      - name: Validate BusyBox present
        run: test -x rootfs/bin/busybox && rootfs/bin/busybox --help >/dev/null
