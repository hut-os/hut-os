# HUT OS mdev configuration
# BusyBox mdev device manager rules

# Support module loading
$MODALIAS=.*	root:root 660 @modprobe "$MODALIAS"

# Null / console / tty
null		root:root 666
zero		root:root 666
full		root:root 666
random		root:root 444
urandom		root:root 444
tty		root:tty 666
console		root:tty 600
ptmx		root:tty 666
pty.*		root:tty 660
tty[0-9]*	root:tty 660
ttyS[0-9]*	root:tty 660

# Input
input/.*	root:root 660
event[0-9]+	root:root 660
mice		root:root 660
mouse[0-9]	root:root 660
js[0-9]		root:root 660

# Block devices
sd[a-z].*	root:disk 660
hd[a-z].*	root:disk 660
vd[a-z].*	root:disk 660
mmcblk[0-9]+	root:disk 660
mmcblk[0-9]+p[0-9]+	root:disk 660
loop[0-9]+	root:disk 660
ram[0-9]*	root:disk 660

# Network interfaces (hotplug helper)
net/.*		root:root 600 @/sbin/mdev-net
